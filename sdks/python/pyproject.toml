[project]
name = "luna-cs-uil"
version = "0.1.0"
description = "Unofficial client for the UIL Computer Science problems API at api.lunaghs.dev. Not affiliated with or endorsed by UIL."
authors = [{ name = "Carlos Luna" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "urllib3>=2.7.0,<3.0.0",
  "python-dateutil>=2.8.2",
  "pydantic>=2.11",
  "typing-extensions>=4.7.1",
]

[project.urls]
Repository = "https://github.com/tacocarlos/cs-uil-api"

[dependency-groups]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luna_cs_uil"]
